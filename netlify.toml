[[redirects]]
  from = "https://www.sfgeo.com.au/*"
  to = "https://sfgeo.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sfgeo.com.au/*"
  to = "https://sfgeo.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sfgeo.com.au/*"
  to = "https://sfgeo.com.au/:splat"
  status = 301
  force = true

# Security headers: one set for every response, matching next.config.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static media under /public is served by the CDN, not by Next, so its caching lives here.
[[headers]]
  for = "/veil/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/docket/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
