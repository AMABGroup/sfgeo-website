[[redirects]]
  from = "https://www.sfgeo.com.au/*"
  to = "https://sfgeo.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sfgeo.com.au/*"
  to = "https://sfgeo.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sfgeo.com.au/*"
  to = "https://sfgeo.com.au/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
